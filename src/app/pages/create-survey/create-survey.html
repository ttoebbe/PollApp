<section class="create">
  <article class="create__card" aria-labelledby="create-heading">
    <header class="create__header">
      <div class="create__header-left">
        <span class="create__badge">Draft</span>
        <h1 id="create-heading" class="create__title">Create new survey</h1>
      </div>
      <a routerLink="/" class="create__cancel" aria-label="Cancel and go back">
        Cancel <span aria-hidden="true">✕</span>
      </a>
    </header>

    <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <app-survey-info-fields
        [titleControl]="titleControl"
        [descriptionControl]="descriptionControl"
        [deadlineControl]="deadlineControl"
        [categoryControl]="categoryControl"
        [categories]="categories"
      />

      <div class="form__questions-wrap">
        <div class="form__questions">
          @for (qCtrl of questions.controls; track $index; let qi = $index) {
            <app-survey-question-block
              [questionGroup]="getQuestion(qi)"
              [questionIndex]="qi"
              [canRemove]="questions.length > 1"
              (remove)="removeQuestion(qi)"
              (addAnswer)="addAnswer(qi)"
              (removeAnswer)="removeAnswer(qi, $event)"
            />
          }
        </div>
        <button type="button" class="form__add-question" (click)="addQuestion()">
          Add next question
          <img src="img/icons/add_circle.svg" width="16" height="16" alt="" />
        </button>
      </div>

      @if (errorMessage()) {
        <p class="form__error form__error--global" role="alert">{{ errorMessage() }}</p>
      }

      <div class="form__actions">
        <button type="submit" class="btn btn--publish" [disabled]="form.invalid || isSubmitting()">
          {{ isSubmitting() ? 'Publishing…' : 'Publish' }}
        </button>
      </div>
    </form>
  </article>
</section>
