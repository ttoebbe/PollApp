<div class="form__top-row">
  <div class="form__field">
    <label for="cs-title">Survey name</label>
    <div class="form__input-wrap">
      <input
        id="cs-title"
        type="text"
        [formControl]="titleControl()"
        placeholder="e.g. Team Event Planning"
        autocomplete="off"
      />
      <button
        type="button"
        class="form__clear"
        [class.form__clear--visible]="titleControl().value"
        [attr.aria-hidden]="!titleControl().value"
        [attr.tabindex]="titleControl().value ? 0 : -1"
        (click)="titleControl().reset('')"
        aria-label="Clear survey name"
      >
        <img src="img/icons/close.svg" width="14" height="14" alt="" />
      </button>
    </div>
    <div class="form__error-slot">
      @if (getTitleError(titleControl()); as msg) {
        <small class="form__error">{{ msg }}</small>
      }
    </div>
  </div>

  <div class="form__field">
    <label for="cs-desc">Describing text <span class="form__hint">(optional)</span></label>
    <div class="form__input-wrap form__input-wrap--textarea">
      <textarea
        id="cs-desc"
        [formControl]="descriptionControl()"
        rows="4"
        placeholder="Give people a bit more context…"
      ></textarea>
      <button
        type="button"
        class="form__clear form__clear--textarea"
        [class.form__clear--visible]="descriptionControl().value"
        [attr.aria-hidden]="!descriptionControl().value"
        [attr.tabindex]="descriptionControl().value ? 0 : -1"
        (click)="descriptionControl().reset('')"
        aria-label="Clear description"
      >
        <img src="img/icons/close.svg" width="14" height="14" alt="" />
      </button>
    </div>
    <div class="form__error-slot">
      @if (getDescriptionError(descriptionControl()); as msg) {
        <small class="form__error">{{ msg }}</small>
      }
    </div>
  </div>
</div>

<div class="form__meta-row">
  <div class="form__field">
    <label for="cs-deadline">Set end date <span class="form__hint">(optional)</span></label>
    <div class="form__input-wrap form__input-wrap--date">
      <input id="cs-deadline" type="date" [min]="todayIso" [formControl]="deadlineControl()" />
      <button
        type="button"
        class="form__clear"
        [class.form__clear--visible]="deadlineControl().value"
        [attr.aria-hidden]="!deadlineControl().value"
        [attr.tabindex]="deadlineControl().value ? 0 : -1"
        (click)="deadlineControl().reset('')"
        aria-label="Clear end date"
      >
        <img src="img/icons/close.svg" width="14" height="14" alt="" />
      </button>
    </div>
    <div class="form__error-slot">
      @if (getDeadlineError(deadlineControl()); as msg) {
        <small class="form__error">{{ msg }}</small>
      }
    </div>
  </div>

  <div class="form__field">
    <label for="cs-cat">Choose category</label>
    <div class="form__select-wrap">
      <select id="cs-cat" [formControl]="categoryControl()">
        @for (c of categories(); track c) {
          <option [value]="c">{{ c }}</option>
        }
      </select>
      <img
        class="form__select-arrow"
        src="img/icons/arrow_drop_down.svg"
        width="16"
        height="16"
        alt=""
      />
    </div>
    <div class="form__error-slot"></div>
  </div>
</div>
