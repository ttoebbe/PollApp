<div class="form__question" [formGroup]="questionGroup()">
  <div class="form__question-header">
    <span class="form__question-num">{{ questionIndex() + 1 }}. Question</span>
    <button
      type="button"
      class="form__icon-btn"
      [class.form__icon-btn--visible]="canRemove()"
      [attr.aria-hidden]="!canRemove()"
      [attr.tabindex]="canRemove() ? 0 : -1"
      (click)="remove.emit()"
      [attr.aria-label]="'Remove question ' + (questionIndex() + 1)"
    >
      <img src="img/icons/delete-icon.svg" width="18" height="18" alt="" />
    </button>
  </div>

  <div class="form__input-wrap">
    <input
      type="text"
      formControlName="label"
      placeholder="Which date would work best for you?"
      [id]="'q-label-' + questionIndex()"
    />
  </div>
  <div class="form__error-slot">
    @if (getLabelError(); as msg) {
      <small class="form__error">{{ msg }}</small>
    }
  </div>

  <div class="form__answers">
    <div class="form__answers-header">
      <span class="form__answers-label">Answers</span>
      <label class="form__checkbox-label">
        <input type="checkbox" formControlName="allow_multiple" />
        Allow multiple answers.
      </label>
    </div>

    <ul class="form__answer-list" role="list" formArrayName="answers">
      @for (aCtrl of answers.controls; track $index; let ai = $index) {
        <li class="form__answer-item">
          <span class="form__letter">{{ getOptionLetter(ai) }}</span>
          <div class="form__input-wrap form__input-wrap--answer">
            <input type="text" [formControlName]="ai" [placeholder]="'Answer ' + (ai + 1)" />
          </div>
          <button
            type="button"
            class="form__icon-btn"
            [class.form__icon-btn--visible]="answers.length > 2"
            [attr.aria-hidden]="answers.length <= 2"
            [attr.tabindex]="answers.length > 2 ? 0 : -1"
            (click)="removeAnswer.emit(ai)"
            [attr.aria-label]="'Remove answer ' + (ai + 1)"
          >
            <img src="img/icons/delete-icon.svg" width="18" height="18" alt="" />
          </button>
        </li>
      }
    </ul>

    <button
      type="button"
      class="form__add-link"
      (click)="addAnswer.emit()"
      [disabled]="answers.length >= 8"
    >
      Add answer
      <img src="img/icons/add_circle.svg" width="16" height="16" alt="" />
    </button>
  </div>
</div>
