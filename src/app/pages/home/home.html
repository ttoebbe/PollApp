<section class="home">
  <section class="hero" aria-labelledby="hero-headline">
    <div class="hero__text">
      <h1 id="hero-headline" class="hero__headline">Collect Feedback,<br />Unlock Ideas</h1>
      <p class="hero__sub">
        Create and share surveys in minutes &mdash; from team events to workplace culture. Collect
        opinions, engage your audience, and turn feedback into action.
      </p>
      <a class="hero__cta" routerLink="/create">
        <span>New survey</span>
        <img src="img/icons/add_circle.svg" width="22" height="22" alt="" />
      </a>
    </div>

    <figure class="hero__visual">
      <img
        class="hero__visual-img"
        ngSrc="img/hero-visual.png"
        alt="Illustration of people collecting feedback and sharing ideas through online surveys"
        width="420"
        height="420"
        priority
      />
      <figcaption class="visually-hidden">
        Hero illustration for the Poll App survey platform
      </figcaption>
    </figure>
  </section>

  <section class="highlights" aria-labelledby="highlights-heading">
    <h2 id="highlights-heading" class="highlights__title">Your surveys</h2>
    <app-urgent-surveys [surveys]="urgentSurveys()"></app-urgent-surveys>
  </section>

  <section class="surveys" aria-labelledby="surveys-heading">
    <h2 id="surveys-heading" class="visually-hidden">All surveys</h2>
    <app-survey-filter
      [activeTab]="activeTab()"
      [selectedCategory]="selectedCategory()"
      [categories]="categories"
      (tabChange)="setTab($event)"
      (categoryChange)="setCategory($event)"
    />
    <app-survey-list
      [surveys]="displayedSurveys()"
      [isLoading]="isLoading()"
      [loadError]="loadError()"
      [isPast]="isPastTab()"
      [activeTab]="activeTab()"
    />
  </section>
</section>
