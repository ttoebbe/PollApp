<div class="surveys__filters">
  <div role="tablist" aria-label="Survey filter">
    <button
      id="tab-active"
      class="tab"
      [class.tab--active]="activeTab() === 'active'"
      role="tab"
      [attr.aria-selected]="activeTab() === 'active'"
      [attr.tabindex]="activeTab() === 'active' ? 0 : -1"
      aria-controls="tab-panel-surveys"
      (click)="setTab('active')"
      (keydown)="onTabKeydown($event, 'active')"
    >
      Active survey
    </button>
    <button
      id="tab-past"
      class="tab"
      [class.tab--active]="activeTab() === 'past'"
      role="tab"
      [attr.aria-selected]="activeTab() === 'past'"
      [attr.tabindex]="activeTab() === 'past' ? 0 : -1"
      aria-controls="tab-panel-surveys"
      (click)="setTab('past')"
      (keydown)="onTabKeydown($event, 'past')"
    >
      Past survey
    </button>
  </div>

  @if (isDropdownOpen()) {
    <div class="dropdown-backdrop" (click)="toggleDropdown()" aria-hidden="true"></div>
  }

  <div class="category-filter" [class.category-filter--open]="isDropdownOpen()">
    <button
      class="category-filter__toggle"
      (click)="toggleDropdown()"
      [attr.aria-expanded]="isDropdownOpen()"
      aria-haspopup="listbox"
    >
      {{ selectedCategory() ?? 'Sort by categories' }}
      <img src="img/icons/arrow_drop_down.svg" width="16" height="16" alt="" />
    </button>

    @if (isDropdownOpen()) {
      <ul class="category-filter__menu" role="listbox" aria-label="Category filter">
        <li role="presentation">
          <button
            role="option"
            [attr.aria-selected]="selectedCategory() === null"
            [class.is-selected]="selectedCategory() === null"
            (click)="setCategory(null)"
          >
            All categories
          </button>
        </li>
        @for (cat of categories(); track cat) {
          <li role="presentation">
            <button
              role="option"
              [attr.aria-selected]="selectedCategory() === cat"
              [class.is-selected]="selectedCategory() === cat"
              (click)="setCategory(cat)"
            >
              {{ cat }}
            </button>
          </li>
        }
      </ul>
    }
  </div>
</div>
