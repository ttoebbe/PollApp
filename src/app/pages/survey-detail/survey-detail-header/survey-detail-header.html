<header class="detail__head">
  <a routerLink="/" class="detail__close" aria-label="Close survey">
    <img src="img/icons/close.svg" width="18" height="18" alt="" />
  </a>
  <div class="detail__head-meta">
    <span class="detail__badge detail__badge--published">Published</span>
    @if (survey().category) {
      <span class="detail__category-label">Category: {{ survey().category }}</span>
    }
  </div>
  @if (survey().deadline) {
    <span class="detail__deadline">Ends on {{ endsOnLabel() }}</span>
  }
  <h1 class="detail__title">{{ survey().title }}</h1>
  @if (survey().description) {
    <p class="detail__desc">{{ survey().description }}</p>
  }
</header>
