<div class="results">
  @if (!compact()) {
    <div class="results__header">
      <span class="results__live" aria-live="polite">
        <span class="results__dot" aria-hidden="true"></span>
        LIVE
      </span>
      <span class="results__total">{{ totalVotes() }} {{ votesLabel() }}</span>
    </div>
  }

  <ul class="results__list" role="list">
    @for (option of options(); track option.id; let i = $index) {
      <li class="results__row" [class.results__row--preview]="isPreview(option)">
        <span class="results__letter">{{ letter(i) }}</span>
        <div
          class="results__track"
          role="progressbar"
          [attr.aria-valuenow]="percentage(option)"
          aria-valuemin="0"
          aria-valuemax="100"
          [attr.aria-label]="option.label + ' result'"
        >
          <div class="results__fill" [style.width.%]="percentage(option)"></div>
        </div>
        <span class="results__pct">{{ percentage(option) }}%</span>
      </li>
    }
  </ul>
</div>
