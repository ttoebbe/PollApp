<article
  class="survey-card"
  [class.survey-card--past]="isPast()"
  [attr.aria-label]="survey().title"
>
  <div class="survey-card__body">
    <h2 class="survey-card__title">{{ survey().title }}</h2>

    @if (survey().description) {
      <p class="survey-card__description">{{ survey().description }}</p>
    }

    @if (survey().deadline) {
      <p class="survey-card__deadline">
        <span class="survey-card__deadline-label">Deadline:</span>
        {{ survey().deadline | date: 'dd.MM.yyyy' }}
      </p>
    }
  </div>

  @if (!isPast()) {
    <a
      class="survey-card__link"
      [routerLink]="['/survey', survey().id]"
      aria-label="Open survey: {{ survey().title }}"
    >
      Vote →
    </a>
  }
</article>
