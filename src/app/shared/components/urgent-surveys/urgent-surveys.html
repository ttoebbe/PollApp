<section class="ending-soon" aria-labelledby="ending-soon-heading">
  <h2 id="ending-soon-heading" class="ending-soon__label">Ending soon surveys</h2>

  <ul class="ending-soon__grid" role="list">
    @for (survey of surveys(); track survey.id) {
      <li class="ending-soon__cell">
        <a
          class="hl-card"
          [routerLink]="['/survey', survey.survey_number]"
          [attr.aria-label]="'Open survey ' + survey.title"
        >
          <span class="hl-card__meta">{{ survey.category ?? 'General' }}</span>
          <h3 class="hl-card__title">{{ survey.title }}</h3>
          <span class="hl-card__pill">{{ survey.endsInLabel() }}</span>
        </a>
      </li>
    } @empty {
      <li class="ending-soon__empty">No urgent surveys right now.</li>
    }
  </ul>
</section>
