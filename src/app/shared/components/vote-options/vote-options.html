<ul class="vote-options" role="list" aria-label="Vote options">
  @for (option of options(); track option.id) {
    <li>
      <button
        class="vote-options__btn"
        type="button"
        (click)="selectOption(option)"
        aria-label="Vote for: {{ option.label }}"
      >
        {{ option.label }}
      </button>
    </li>
  }
</ul>
